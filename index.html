<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        form { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .comment-card { border-left: 4px solid #007BFF; background: #f4f6f9; padding: 10px; margin-bottom: 10px; border-radius: 0 4px 4px 0; }
        .comment-card h4 { margin: 0 0 5px 0; color: #333; }
        .comment-card .email { font-size: 0.85em; color: #666; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>Добавить комментарий (POST)</h2>
    
    <form id="commentForm">
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" required placeholder="Введите ваше имя">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label for="body">Комментарий:</label>
            <textarea id="body" rows="4" required placeholder="Текст комментария..."></textarea>
        </div>
        <button type="submit">Отправить</button>
    </form>

    <h2>Список комментариев (GET)</h2>
    <div id="commentsContainer">Загрузка комментариев...</div>


    <script src="./main.js"></script>
</body>
</html>
